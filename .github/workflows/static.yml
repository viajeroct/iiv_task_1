name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pr1-static-sites/requirements.txt

      - name: Install dependencies
        working-directory: pr1-static-sites
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        working-directory: pr1-static-sites
        env:
          # Сайт публикуется в подкаталоге /iiv_task_1/, поэтому базовый URL
          # отличается от адреса на Helios (см. site_url в mkdocs.yml).
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python scripts/damped_fit.py
          python scripts/make_plotly.py
          mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pr1-static-sites/site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
